<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Calcolatrice</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h1>Calcolatrice</h1>
        <p>Questa è la pagina della calcolatrice del mio server Node.js!</p>
        <p>Puoi eseguire operazioni matematiche semplici come addizione, sottrazione, moltiplicazione e divisione.</p>
        <form action="">
            <input type="number" id="numero1" placeholder="Inserisci il primo numero">
            <input type="number" id="numero2" placeholder="Inserisci il secondo numero">
            <select id="operazione">
                <option value="addizione">+</option>
                <option value="sottrazione">-</option>
                <option value="moltiplicazione">*</option>
                <option value="divisione">/</option>
            </select>
            <button type="submit">Calcola</button>
        </form>
        <script src="script.js" async defer></script>
    </body>
</html>
