<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Zoo Interattivo</title>
</head>

<body>

    <div class="container">

        <h1 id="titolo">Zoo Safari</h1>

        <p class="descrizione">
            Benvenuto nello zoo interattivo! Qui puoi aggiungere e rimuovere animali.
        </p>

        <div class="buttons">
            <button id="btnLeone">Aggiungi leone</button>
            <button id="btnElefante">Aggiungi elefante</button>
            <button id="btnRimuovi">Rimuovi ultimo animale</button>
            <button id="btnTema">Cambia tema dello zoo</button>
        </div>

        <div id="divAnimali"></div>

    </div>
    <script src="script.js"></script>
</body>

</html>
