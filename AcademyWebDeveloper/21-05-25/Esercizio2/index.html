<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
        <div class="navbar">
            <h1>Libreria Digital</h1>
            <div class="hamburger" id="hamburger">☰</div>
            <nav class="nav" id="nav">
                <a href="#">Home</a>
                <a href="#">Libri</a>
                <a href="#">Autori</a>
                <a href="#">Contatti</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="intro">
            <h2>Benvenuto nella tua libreria digitale</h2>
            <p>Scopri una vasta selezione di libri digitali, dai classici ai bestseller più recenti. La tua avventura letteraria inizia qui!</p>
        </section>
        <section>
            <h2>Inserisci un nuovo libro</h2>
            <form action="*" id="bookForm">
                <input type="text" placeholder="Titolo del libro"  id="title" required>
                <input type="text" placeholder="Autore" id="author" required>
                <input type="number" placeholder="Anno di pubblicazione" id="year" required min="1900" max="2026">
                <select name="genre" id="genre" required>
                    <option value="">Seleziona genere</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="romanzo">Romanzo</option>
                    <option value="horror">Horror</option>
                    <option value="storico">Storico</option>
                    <option value="thriller">Thriller</option>
                </select>
                <textarea placeholder="Breve descrizione" id="description" required></textarea>
                <button type="submit">Aggiungi libro</button>
            </form>
        </section>
        <section>
            <h2>La tua collezione di libri</h2>
            <div class="book-list" id="bookList">
                <!-- I libri aggiunti appariranno qui -->
            </div>
        </section>
        
        <script src="script.js" ></script>
    </body>
</html>
