<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyStore - Aggiungi Giocattoli</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">🧸 Aggiungi Giocattolo</a>
        <a href="catalogo.html">🚀 Visualizza Catalogo</a>
        <a href="riepilogo.html">📊 Riepilogo Negozio</a>
    </nav>

    <h1>🎨 Inserisci un Nuovo Giocattolo 🧩</h1>

    <div class="form-container">
        <form id="toyForm">
            <div class="form-group">
                <label for="nome">Nome del Giocattolo:</label>
                <input type="text" id="nome" placeholder="es. Super Robot XYZ" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria di Gioco:</label>
                <select id="categoria" required>
                    <option value="">Scegli una categoria...</option>
                    <option value="Giochi da tavolo">🎲 Giochi da tavolo</option>
                    <option value="Bambole e Peluche">🧸 Bambole e Peluche</option>
                    <option value="Costruzioni">🧱 Costruzioni</option>
                    <option value="Videogiochi">🎮 Videogiochi</option>
                    <option value="Esterni e Sport">⚽ Esterni e Sport</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prezzo">Prezzo (€):</label>
                <input type="number" id="prezzo" step="0.01" min="0" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="eta">Età Consigliata:</label>
                <input type="number" id="eta" placeholder="es. 3+ o 8-12 anni" required>
            </div>

            <div class="form-group">
                <label for="disponibile" style="cursor: pointer;">
                    <input type="checkbox" id="disponibile" checked> 🟢 Disponibile subito in negozio
                </label>
            </div>

            <button type="submit">✨ Salva nei Giochi! ✨</button>
            <div id="feedback" class="messaggio"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
