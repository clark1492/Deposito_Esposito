<h1>Calcolatore IVA</h1>

<p>PrezzoNetto : {{prezzoNetto()}} $</p>
<p>AliquotaIVA : {{aliquotaIva()}} %</p>
<p>prezzoLordo : {{prezzoLordo()}} $</p>

<p>Cambia prezzo netto:</p>
<input type="number" [value] = "prezzoNetto()" (input)="updatePrice($event)">
